<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playbook</title>
  <meta name="description" content="Playbook: tasks, schedule, Instagram consistency, My Book, thoughts and books.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Playbook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved look before first paint so there is no flash.
    try {
      var m = localStorage.getItem('tracker.theme') || 'dark', p = localStorage.getItem('tracker.palette') || 'lavender';
      if (m === 'auto') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = m;
      document.documentElement.dataset.palette = p;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <button class="icon-btn" data-act="toggleRail" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a class="brand" href="#/" aria-label="Playbook home">
        <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
          <defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient></defs>
          <rect width="40" height="40" rx="11" fill="url(#pbg)"/>
          <rect x="10.5" y="10" width="4.2" height="20" rx="2.1" style="fill:var(--on-accent)"/>
          <path d="M18.6 11.6c0-1.3 1.4-2.1 2.5-1.4l10.2 7.3c1 .7 1 2.1 0 2.8l-10.2 7.3c-1.1.8-2.5-.1-2.5-1.4z" style="fill:var(--on-accent)"/>
        </svg>
        <span>Playbook</span>
      </a>
      <span class="spacer"></span>
      <div class="top-search">
        <svg class="ic" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="globalSearch" type="search" placeholder="Type to search…" autocomplete="off" aria-label="Search everything" data-input="globalSearch">
        <kbd>Ctrl K</kbd>
        <div class="search-pop" id="searchPop" hidden></div>
      </div>
      <a class="avatar" href="#/settings" aria-label="Settings">SP</a>
    </header>
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <div class="scrim" data-act="toggleRail"></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="bottombar" id="bottombar" aria-label="Main"></nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
